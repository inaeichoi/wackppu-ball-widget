name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller Pillow

      - name: Build typing executable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name WackppuBallWidget
          --add-data "assets/wakppu-ball.png;assets"
          --add-data "assets/sounds/wakppu-asmr-source.mp3;assets/sounds"
          wakppu_widget.py

      - name: Build click executable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name WackppuBallClickWidget
          --add-data "assets/wakppu-ball.png;assets"
          --add-data "assets/sounds/wakppu-asmr-source.mp3;assets/sounds"
          wakppu_click_widget.py

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/WackppuBallWidget.exe package/WackppuBallWidget.exe
          Copy-Item dist/WackppuBallClickWidget.exe package/WackppuBallClickWidget.exe
          Set-Content -Encoding ASCII package/run-widget.bat -Value @(
            '@echo off'
            'start "" "%~dp0WackppuBallWidget.exe"'
          )
          Set-Content -Encoding ASCII package/run-click-widget.bat -Value @(
            '@echo off'
            'start "" "%~dp0WackppuBallClickWidget.exe"'
          )
          Compress-Archive -Path package/* -DestinationPath WackppuBallWidget-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WackppuBallWidget-windows
          path: WackppuBallWidget-windows.zip

      - name: Create GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${env:GITHUB_REF_NAME}" WackppuBallWidget-windows.zip --generate-notes
